apiVersion: v1
kind: Namespace
metadata:
  name: biocore
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: biocore-config
  namespace: biocore
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  DATA_REGION: "india"
  MATCH_THRESHOLD: "0.5"
  COOKIE_SECURE: "true"
  ZEPIRIS_URL: "http://zepiris-main:8000"
  MILVUS_HOST: "milvus"
  MILVUS_PORT: "19530"
  MINIO_ENDPOINT: "minio:9000"
  RABBITMQ_EXCHANGE: "biocore.events"
---
# Template only — create the real Secret with `kubectl create secret generic biocore-secrets`
# or a sealed-secret/External Secrets operator. NEVER commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: biocore-secrets
  namespace: biocore
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://biocore:CHANGE_ME@postgres:5432/biocore"
  REDIS_URL: "redis://redis:6379/0"
  RABBITMQ_URL: "amqp://biocore:CHANGE_ME@rabbitmq:5672//"
  MINIO_KEY: "CHANGE_ME"
  MINIO_SECRET: "CHANGE_ME"
  SESSION_SECRET: "CHANGE_ME"
  CSRF_SECRET: "CHANGE_ME"
  SMTP_URL: ""
