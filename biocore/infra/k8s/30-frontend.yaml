apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: biocore
  labels: { app: frontend }
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/biocore-frontend:latest
          ports:
            - containerPort: 3000
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: biocore
spec:
  selector: { app: frontend }
  ports:
    - port: 3000
      targetPort: 3000
