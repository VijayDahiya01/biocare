apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: biocore
  labels: { app: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/biocore-api:latest
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef: { name: biocore-config }
            - secretRef: { name: biocore-secrets }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
