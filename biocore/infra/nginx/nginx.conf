# BioCore gateway — TLS 1.3 termination, routing, rate limits.
# Non-negotiable: no plain HTTP serving of the app; 80 only redirects to 443.

worker_processes auto;
events { worker_connections 1024; }

http {
    # --- rate limit zones (per API Reference) ---
    # default 100 req/min per session-ish (by IP here at the edge);
    # face search is tighter and limited per-device in the app layer too.
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=facesearch:10m rate=30r/m;

    sendfile on;
    server_tokens off;

    upstream api      { server api:8080; }
    upstream frontend { server frontend:3000; }

    # redirect all http -> https
    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers on;

        # security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 12m;   # base64 face frames

        location /api/v1/faces/search {
            limit_req zone=facesearch burst=10 nodelay;
            proxy_pass http://api;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://api;
            include /etc/nginx/proxy_params.conf;
        }

        location / {
            proxy_pass http://frontend;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
